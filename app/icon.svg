<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0A0A0F"/>

  <!-- Purple diamond — matches the rotate-45 square in the Navbar logo -->
  <rect x="9" y="9" width="14" height="14" rx="2" fill="#9B5CFF" transform="rotate(45 16 16)" filter="url(#g)"/>
</svg>
