<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0A0A0F"/>

  <!--
    Bold C arc:
    Centre (16,16), arc-radius 9.75 (midpoint of 7.5–12 ring)
    Opening ±40° from 3-o'clock = 80° gap facing right
    Upper-right: (23.47, 9.73)  Lower-right: (23.47, 22.27)
    large-arc=1  sweep=0  → CCW on screen = traces the long way around (top→left→bottom)
  -->
  <path
    d="M 23.47,9.73 A 9.75,9.75 0 1,0 23.47,22.27"
    fill="none"
    stroke="#9B5CFF"
    stroke-width="4.5"
    stroke-linecap="round"
    filter="url(#g)"
  />
</svg>
